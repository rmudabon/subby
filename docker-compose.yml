services:
  db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: subbydb
    volumes:
      - pgdata:/var/lib/postgresql/
    ports:
      - '5432:5432'

  backend:
    build: ./backend
    restart: always
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/subbydb
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - /app/.venv
    expose:
      - '8000'

  frontend:
    build: ./frontend
    restart: always
    volumes:
      - ./frontend:/app
      - /app/node_modules
    expose:
      - '5173'

  nginx:
    image: nginx:latest
    restart: always
    ports:
      - '8000:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
